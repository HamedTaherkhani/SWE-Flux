# Conda environment for the rest of the repository: evaluation runtimes,
# evaluation_scripts (llm_eval, scoring), notebooks, and dev tooling.
# For QLoRA fine-tuning, use fine-tuning/environment.yml instead.
name: Triad_env
channels:
  - conda-forge
variables:
  PYTHONNOUSERSITE: "1"   # ignore ~/.local site-packages (no TF leakage)
  TRANSFORMERS_NO_TF: "1" # transformers won't import TensorFlow
  VLLM_USE_V1: "0"        # avoid numba/llvmlite/LLVM/glibc headaches
  TORCH_COMPILE_DISABLE: "1"  # belt-and-suspenders: avoid torch.compile path
  TORCHDYNAMO_DISABLE: "1"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"  # reduce CUDA allocator fragmentation
dependencies:
  - python=3.11
  - "numpy<2"
  - "datasets<4.0.0"
  - coverage=7.10.1
  - pytest=8.4.1
  - autopep8
  - astor
  - evaluate
  - "pybind11>=2.12"
  - "libgcc-ng>=13"
  - "libstdcxx-ng>=13"
  - safetensors=0.6.2
  - gradio=5.42.0
  - ruff=0.12.10
  - pip
  - pip:
      # --- Notebook / env helpers (pypi in current Triad) ---
      - jupyterlab==4.4.6
      - python-dotenv==1.2.1
      - requests==2.32.5
      # --- AI/LLM clients ---
      - openai==2.20.0
      - anthropic==0.97.0
      - google-genai==1.24.0
      - llamaapi==0.1.36
      - transformers==5.6.2
      - tokenizers==0.22.2
      - mutmut==2.5.1
      # vLLM + PyTorch stack via pip to ensure CUDA/ABI compatibility ---
      # NOTE: We intentionally do NOT install torch from conda to avoid conflicts.
      # Versions here match a working vLLM + torch stack in Triad.
      - vllm==0.19.1
      - blake3==1.0.5
      - networkx==3.4.2
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0
      - scipy==1.15.3
      # - aider-chat==0.86.2
