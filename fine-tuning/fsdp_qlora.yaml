# Accelerate FSDP-1 config for QLoRA fine-tuning of Gemma 4 4B on 2× H100.
#
# Why FSDP-1 and not FSDP-2
# ─────────────────────────
# FSDP-2 is the future, but its DTensor sharding path does not yet handle
# bitsandbytes' Params4bit tensor subclass cleanly: the rank-0-load-and-broadcast
# code in accelerate.utils.fsdp_utils.fsdp2_load_full_state_dict reads
# `.device_mesh` off each parameter and crashes for plain bnb 4-bit tensors
# ("AttributeError: 'Tensor' object has no attribute 'device_mesh'").
# FSDP-1 has the proven QLoRA path (Answer.AI recipe) and works with
# accelerate ≥ 1.3 + bitsandbytes ≥ 0.44.
#
# Why each setting matters
# ────────────────────────
# - distributed_type: FSDP             — shard params/grads/opt-state across ranks.
# - mixed_precision: bf16              — H100 native; matches bnb_4bit_compute_dtype.
# - fsdp_sharding_strategy: FULL_SHARD — ZeRO-3 equivalent: shard params + grads + opt.
# - fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
#     fsdp_transformer_layer_cls_to_wrap: Gemma4TextDecoderLayer
#                                       — wrap each decoder block as its own FSDP unit
#                                         (class name confirmed by inspecting the local
#                                         model in transformers 5.x).
# - fsdp_use_orig_params: true         — REQUIRED for PEFT/LoRA: keeps LoRA params
#                                         addressable as separate parameters.
# - fsdp_cpu_ram_efficient_loading: false / fsdp_sync_module_states: false
#                                       — DISABLED for QLoRA. The rank-0-broadcast
#                                         path doesn't compose with bnb 4-bit tensors.
#                                         Each rank loads its own copy from disk; the
#                                         4-bit base is ~2 GB so this is cheap.
# - fsdp_offload_params: false         — keep params on GPU. Flip to true ONLY if you
#                                         push max_seq_length past ~24 k and OOM.
# - fsdp_state_dict_type: SHARDED_STATE_DICT
#                                       — fastest checkpointing.
# - fsdp_forward_prefetch: true / fsdp_backward_prefetch: BACKWARD_PRE
#                                       — overlap all-gather with compute (FSDP-1).
# - num_processes: 2                   — one process per H100.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16

num_machines: 1
num_processes: 2
machine_rank: 0
main_training_function: main

# Use all 2 GPUs visible to the launcher. Override at the command line with
# CUDA_VISIBLE_DEVICES if your node has more than 2 H100s and you only want 2.
gpu_ids: all

fsdp_config:
  fsdp_version: 1
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Gemma4TextDecoderLayer
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: false
  fsdp_offload_params: false
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_forward_prefetch: true
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_activation_checkpointing: false   # SFTConfig handles gradient checkpointing

# No DeepSpeed, no Megatron — pure FSDP.
deepspeed_config: {}
megatron_lm_config: {}

# rdzv settings (unused on a single node but accelerate requires the keys to exist).
rdzv_backend: static
same_network: true

tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
debug: false
