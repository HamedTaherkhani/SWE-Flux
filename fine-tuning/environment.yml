# Conda environment for fine-tuning only (fine-tuning/train.py and finetune/*).
# For evaluation, vLLM serving, and general repo work, use ../environment.yml.
name: RepoBehave_finetune
channels:
  - conda-forge
variables:
  PYTHONNOUSERSITE: "1"   # ignore ~/.local site-packages (no TF leakage)
  TRANSFORMERS_NO_TF: "1" # transformers won't import TensorFlow
  VLLM_USE_V1: "0"        # avoid numba/llvmlite/LLVM/glibc headaches
  TORCH_COMPILE_DISABLE: "1"  # belt-and-suspenders: avoid torch.compile path
  TORCHDYNAMO_DISABLE: "1"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"  # reduce CUDA allocator fragmentation
dependencies:
  - python=3.11
  - "numpy<2"
  - "datasets<4.0.0"
  - coverage=7.10.1
  - pytest=8.4.1
  - ruff=0.12.10
  - evaluate
  - "pybind11>=2.12"
  - "libgcc-ng>=13"
  - "libstdcxx-ng>=13"
  - safetensors=0.6.2
  - pip
  - pip:
      - python-dotenv==1.2.1
      - requests==2.32.5
      # Capped at 5.5.0 because unsloth==2026.5.8 requires transformers<=5.5.0.
      # The default (non-unsloth) path runs fine on 5.5.0 too.
      - transformers==5.5.0
      - tokenizers==0.22.2
      # --- QLoRA / fine-tuning stack ---
      # bitsandbytes: 4-bit NF4 quantization (QLoRA).
      #   Must be built against the CUDA version present on the training node.
      #   Install the CUDA-specific wheel on the cluster if this generic one
      #   does not detect your GPU:
      #     pip install bitsandbytes --index-url https://huggingface.github.io/bitsandbytes-cuda-versions/
      #   Floor raised to 0.45.5 for unsloth compatibility.
      - bitsandbytes>=0.45.5
      # peft: LoRA / QLoRA adapter layers.
      - peft>=0.15.0
      # trl floor raised to 0.18.2 (and capped at 0.24.0) for unsloth==2026.5.8.
      - trl>=0.18.2,<=0.24.0
      # accelerate: device placement, mixed-precision, gradient checkpointing,
      # and FSDP-2 multi-GPU sharding for QLoRA (used by fsdp_qlora.yaml).
      - accelerate>=1.3.0
      # flash-attn: memory-efficient attention for long-context training.
      #   On Compute Canada, prefer the cluster wheelhouse / matching torch build.
      # - flash-attn>=2.7.0
      # wandb: experiment tracking (optional — set --report-to none to skip).
      - wandb>=0.19.0
      # unsloth: backend for --use-unsloth (longer context on H100).
      #   2026.5.8 is the latest as of 2026-05; it requires transformers<=5.5.0,
      #   trl in [0.18.2, 0.24.0], torch<2.11, and bitsandbytes>=0.45.5 — all
      #   reflected in the pins above. Install the matching xformers wheel for
      #   your CUDA/torch combo per https://unsloth.ai/docs if needed.
      - unsloth==2026.5.8
      # xformers: unsloth's fused attention kernels. 0.0.34 is the wheel
      #   unsloth==2026.5.8 pairs with torch 2.10.0 (same across cu126/cu128/cu130).
      #   It must be the build matching the training node's CUDA — install the
      #   CUDA-specific wheel from https://download.pytorch.org/whl if pip picks
      #   the wrong one.
      - xformers==0.0.34
      # PyTorch stack (pip; pin together with the training node CUDA stack)
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0
      - networkx==3.4.2
      - scipy==1.15.3
